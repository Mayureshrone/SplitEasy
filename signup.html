<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup</title>

    <link rel="stylesheet" href="/login.css">
    <link rel="icon" type="image/x-icon" href="images/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/83df1a5322.js" crossorigin="anonymous"></script>
   
</head>

<body>
     <!-- Header -->
    <header>

    <div class="logo">
        <img src="/images/logo.png" alt="SplitEasy Logo">
        <h2>Split<span>Easy</span></h2>
    </div>

    <div class="header-actions">

        <button
            class="header-calculate"
            id="headerCalculate"
        >
            <a href="/index.html">Calculate Split</a>
        </button>

        <button
            class="header-login"
            id="loginBtn"
        >

        <a href="/login.html">Login</a>
            
        </button>

        <button
            class="header-signup"
            id="signupBtn"
        >
        <a href="signup.html">Signup</a>
        </button>

        

    </div>

</header>
   
    <!--Start authentication section-->
<section class="auth-container">

    <div class="auth-box">

        <h2>Create Account</h2>

        <form id="signUp">
           <div>
            <input type="text" placeholder="Full name"  id="name">
            <small></small>
           </div>
            
           <div>
            <input type="email" placeholder="Email"  id="email">
            <small></small>
           </div>
            
           <div>
            <input type="password" placeholder="Password"  id="password">
            <small></small>
           </div>
            
           <div>
            <input type="password" placeholder="Confirm password"  id="confirm-password">
            <small></small>
           </div>
            

            <button type="submit">Signup</button>
        </form>

        <p>Already have an account? <a href="login.html">Login</a></p>

    </div>

</section>

<!--End authentication section-->

 <script src="formvalidation.js"></script>
</body>

</html>
